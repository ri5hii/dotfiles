add_newline = false

format = """
$username$directory$git_branch$git_status$python$nodejs$bun$golang$rust$zig$fill$cmd_duration$time
$character
"""

[custom.git_dirty]
when = "git diff --quiet || exit 1"
command = "echo dirty"

[custom.git_ahead]
when = "git status -sb | grep -q '\\[ahead'"
command = "echo ahead"

[custom.git_conflict]
when = "git diff --name-only --diff-filter=U | grep -q ."
command = "echo conflict"

[custom.git_safe]
when = "! git diff --quiet && false"
command = "false"

[custom.git_danger]
when = "git diff --name-only --diff-filter=U | grep -q ."
format = "[󰊢 $git_status](bg:#de6145 fg:#101315)[](fg:#de6145 bg:#798186)"

[custom.git_dirty_block]
when = "git diff --quiet || exit 1"
format = "[󰊢 $git_status](bg:#c9c2b4 fg:#101315)[](fg:#c9c2b4 bg:#798186)"

[python]
symbol = "🐍"
style = "fg:#c9c2b4"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = "🟢"
style = "fg:#9fa5a9"
format = "[ $symbol $version ]($style)"

[bun]
symbol = "🥟"
style = "fg:#aeaeae"
format = "[ $symbol $version ]($style)"

[golang]
symbol = "🐹"
style = "fg:#cbc2be"
format = "[ $symbol $version ]($style)"

[rust]
symbol = "🦀"
style = "fg:#de6145"
format = "[ $symbol $version ]($style)"

[zig]
symbol = "⚡"
style = "fg:#798186"
format = "[ $symbol $version ]($style)"

[fill]
symbol = " "
style = "bg:none"

# -----------------------------
# Identity & location
# -----------------------------
[username]
show_always = true
style_user = "bg:#798186 fg:#101315"
format = "(fg:#798186)[ $user]($style)[](fg:#798186 bg:#282c34)"

[directory]
style = "bg:#282c34 fg:#cbc2be"
format = "[󰉋 $path]($style)"

# -----------------------------
# Git
# -----------------------------
[git_branch]
symbol = ""
style = "bg:#343d41 fg:#9fa5a9"
format = "[](fg:#282c34 bg:#343d41)[$symbol $branch]($style)"

[git_status]
style = "bg:#4b4e55 fg:#cacccc"
format = "[](fg:#343d41 bg:#4b4e55)[󰊢 $all_status$ahead_behind]($style)[](fg:#4b4e55 bg:#282c34)"

conflicted = "[!](fg:#de6145 bg:#4b4e55) "
modified   = "[●](fg:#c9c2b4 bg:#4b4e55) "
staged     = "[+](fg:#9fa5a9 bg:#4b4e55) "
untracked  = "[?](fg:#cbc2be bg:#4b4e55) "
deleted    = "[✖](fg:#de6145 bg:#4b4e55) "
renamed    = "[➜](fg:#798186 bg:#4b4e55) "
stashed    = "[≡](fg:#aeaeae bg:#4b4e55) "

ahead      = "[⇡](fg:#9fa5a9 bg:#4b4e55) "
behind     = "[⇣](fg:#de6145 bg:#4b4e55) "

# -----------------------------
# Performance & Time
# -----------------------------

[cmd_duration]
min_time = 2000
style = "bg:#798186 fg:#101315"
format = "[ $duration ]($style)[](fg:#798186 bg:#282c34)"

[time]
disabled = true
time_format = "%H:%M"
style = "bg:#080a0b fg:#cacccc"
format = "[  $time]($style)[](fg:#080a0b)"

# -----------------------------
# Prompt character
# -----------------------------
[character]
success_symbol = "[❯](fg:#cbc2be)"
error_symbol = "[❯❯](fg:#de6145)"

# -----------------------------
# Error status
# -----------------------------
[status]
disabled = false
format = " [$symbol$status]($style)"
symbol = "✖"
style = "bold red"
