# omarchy-config/system-update.conf
# Your system update steps, run in order by the menu's "Update -> System Update"
# (omarchy-update -> omarchy-system-update) after Omarchy itself is updated.
#
# Rules:
#   - '#' starts a comment (full line)
#   - '!' at line start = disabled step, skipped until you remove the '!'
#   - any other line runs via bash -c (pipes and && work; sudo is fine inside)
#   - a failing step stops the update and reports the error
#   - empty file (or no file) = Omarchy-only updates, no system update
#
# Pick a preset below, or write your own. Full reference: docs/system-update.md

# --- Preset: Fedora (dnf + optional flatpak) ---
#dnf upgrade --refresh
#flatpak update -y

# --- Preset: Debian / Ubuntu (apt) ---
#sudo apt update
#sudo apt upgrade -y
#flatpak update -y

# --- Preset: Arch (original Omarchy behavior) ---
#omarchy-update-keyring
#omarchy-update-system-pkgs
#omarchy-update-aur-pkgs
#omarchy-update-orphan-pkgs
#omarchy-update-pkg-prune

# --- Arch-only steps, disabled by default. Remove the '!' to enable ---
!omarchy-update-keyring
!pacman -Syu --noconfirm
!omarchy-update-aur-pkgs
!omarchy-update-orphan-pkgs
!omarchy-update-pkg-prune