# omarchy-config/pkgmap/pkgmap.conf
# Translates Arch package names to your distro's packages.
# Format: <arch-name> | dnf=<pkg> | apt=<pkg> | pacman=<pkg> | flatpak=<app-id> | unsupported
#   - targets are matched against the active backend (dnf on Fedora, apt on
#     Debian/Ubuntu, pacman on Arch)
#   - a flatpak= target is used as fallback when the distro backend has no entry
#   - "unsupported" means knowingly unavailable (menu shows a notice instead of an error)
#   - names without a line pass through to the distro repo unchanged
# Full reference: docs/pkgmap.md

# --- Editors / AI ---
cursor-bin             | dnf=cursor | apt=cursor
visual-studio-code-bin | dnf=code | apt=code | flatpak=com.visualstudio.code
sublime-text-4         | flatpak=com.sublimetext.4
lmstudio-bin           | flatpak=ai.lmstudio.LMStudio
grok-bot               | unsupported
ollama                 | dnf=ollama | apt=ollama
ollama-cuda            | unsupported
ollama-rocm            | unsupported

