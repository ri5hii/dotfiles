add_newline = false

format = """
$username$directory$git_branch$git_status$python$nodejs$bun$golang$rust$zig$fill$cmd_duration$time
$character
"""

[custom.git_dirty]
when = "git diff --quiet || exit 1"
command = "echo dirty"

[custom.git_ahead]
when = "git status -sb | grep -q '\\[ahead'"
command = "echo ahead"

[custom.git_conflict]
when = "git diff --name-only --diff-filter=U | grep -q ."
command = "echo conflict"

[custom.git_safe]
when = "! git diff --quiet && false"
command = "false"

[custom.git_danger]
when = "git diff --name-only --diff-filter=U | grep -q ."
format = "[󰊢 $git_status](bg:#f85525 fg:#05182e)[](fg:#f85525 bg:#faa968)"

[custom.git_dirty_block]
when = "git diff --quiet || exit 1"
format = "[󰊢 $git_status](bg:#e97b3c fg:#05182e)[](fg:#e97b3c bg:#faa968)"

[python]
symbol = "🐍"
style = "fg:#e97b3c"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = "🟢"
style = "fg:#028391"
format = "[ $symbol $version ]($style)"

[bun]
symbol = "🥟"
style = "fg:#3f8f8a"
format = "[ $symbol $version ]($style)"

[golang]
symbol = "🐹"
style = "fg:#a7c9c6"
format = "[ $symbol $version ]($style)"

[rust]
symbol = "🦀"
style = "fg:#f85525"
format = "[ $symbol $version ]($style)"

[zig]
symbol = "⚡"
style = "fg:#faa968"
format = "[ $symbol $version ]($style)"

[fill]
symbol = " "
style = "bg:none"

# -----------------------------
# Identity & location
# -----------------------------
[username]
show_always = true
style_user = "bg:#faa968 fg:#05182e"
format = "(fg:#faa968)[ $user]($style)[](fg:#faa968 bg:#05182e)"

[directory]
style = "bg:#05182e fg:#a7c9c6"
format = "[󰉋 $path]($style)"

# -----------------------------
# Git
# -----------------------------
[git_branch]
symbol = ""
style = "bg:#134e5a fg:#028391"
format = "[](fg:#05182e bg:#134e5a)[$symbol $branch]($style)"

[git_status]
style = "bg:#2a6b78 fg:#f6dcac"
format = "[](fg:#134e5a bg:#2a6b78)[󰊢 $all_status$ahead_behind]($style)[](fg:#2a6b78 bg:#05182e)"

conflicted = "[!](fg:#f85525 bg:#2a6b78) "
modified   = "[●](fg:#e97b3c bg:#2a6b78) "
staged     = "[+](fg:#028391 bg:#2a6b78) "
untracked  = "[?](fg:#a7c9c6 bg:#2a6b78) "
deleted    = "[✖](fg:#f85525 bg:#2a6b78) "
renamed    = "[➜](fg:#faa968 bg:#2a6b78) "
stashed    = "[≡](fg:#3f8f8a bg:#2a6b78) "

ahead      = "[⇡](fg:#028391 bg:#2a6b78) "
behind     = "[⇣](fg:#f85525 bg:#2a6b78) "

# -----------------------------
# Performance & Time
# -----------------------------

[cmd_duration]
min_time = 2000
style = "bg:#faa968 fg:#05182e"
format = "[ $duration ]($style)[](fg:#faa968 bg:#05182e)"

[time]
disabled = true
time_format = "%H:%M"
style = "bg:#020c17 fg:#f6dcac"
format = "[  $time]($style)[](fg:#020c17)"

# -----------------------------
# Prompt character
# -----------------------------
[character]
success_symbol = "[❯](fg:#a7c9c6)"
error_symbol = "[❯❯](fg:#f85525)"

# -----------------------------
# Error status
# -----------------------------
[status]
disabled = false
format = " [$symbol$status]($style)"
symbol = "✖"
style = "bold red"
